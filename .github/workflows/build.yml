# Builds the program, vets it, lints it and runs its tests, on every push and
# pull request.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Qt's development files, which the bindings are built with. The tests
      # draw on Qt's offscreen platform, which needs nothing more.
      - name: Install what building needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config qt6-base-dev libgl-dev
          pkg-config --modversion Qt6Widgets

      - uses: actions/checkout@v4

      # It keeps what is compiled from one run to the next, which matters
      # as the Qt bindings take minutes to compile.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      # Without -race, as the app runs on Qt's main thread and a race build
      # of the bindings costs minutes.
      - name: Test
        run: make test

      - name: Lint
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/tools/cmd/deadcode@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
          test -z "$("$(go env GOPATH)/bin/deadcode" -test ./...)"
